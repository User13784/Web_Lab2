<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty - Галерея персонажей</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>🎨 Галерея персонажей</h1>
            <p class="subtitle">Rick and Morty Universe</p>
        </header>

        <main>
            <div class="controls">
                <div class="search-wrapper">
                    <div class="search-container">
                        <span class="search-icon">🔍</span>
                        <input 
                            type="text" 
                            id="searchInput" 
                            placeholder="Поиск персонажей..." 
                            autocomplete="off"
                        >
                        <button id="clearSearch" class="clear-btn" aria-label="Очистить">✕</button>
                    </div>
                </div>

                <div class="filter-wrapper">
                    <label for="genderSelect">Пол:</label>
                    <select id="genderSelect" class="gender-select">
                        <option value="all">Все персонажи</option>
                        <option value="female">♀ Female</option>
                        <option value="male">♂ Male</option>
                        <option value="genderless">⚬ Genderless</option>
                        <option value="unknown">❓ Unknown</option>
                    </select>
                </div>
            </div>

            <div class="results-info" id="resultsInfo"></div>

            <div id="charactersGrid" class="characters-grid"></div>

            <div id="loadingIndicator" class="loading-indicator hidden">
                <div class="spinner"></div>
                <p>Загрузка...</p>
            </div>

            <div id="noResults" class="no-results hidden">
                <div class="no-results-content">
                    <span class="emoji">🔍❌</span>
                    <h3>Ничего не найдено</h3>
                    <p>Попробуйте изменить параметры поиска или фильтрации</p>
                </div>
            </div>

            <button id="loadMoreBtn" class="load-more-btn">Load more</button>
        </main>

        <footer class="footer">
            <p>© 2025 | 
                <a href="https://github.com/yourusername" target="_blank" rel="noopener noreferrer">
                    GitHub автора
                </a>
            </p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
