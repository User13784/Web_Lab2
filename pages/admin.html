<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Admin Panel - Greenery</title>
    <link rel="stylesheet" href="../css/features.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/themes.css">
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
</head>
<body>
    <div class="vertical-line">
        <div class="logo-container">
            <img src="../assets/icons/logo.png" alt="logo" data-theme-img data-light-src="../assets/icons/logo.png" data-dark-src="../assets/icons/logo.png">
        </div>
        <nav class="menu-container" aria-label="Sidebar navigation">
            <div class="menu-item home-item">
                <a href="../index.html#hero">
                    <img src="../assets/icons/home.png" alt="home">
                    <span data-i18n="home">Home</span>
                </a>
            </div>
            <div class="menu-item shop-item">
                <a href="catalog.html">
                    <img src="../assets/icons/shop.png" alt="shop">
                    <span data-i18n="shop">Shop</span>
                </a>
            </div>
            <div class="menu-item">
                <a href="favorites.html">
                    <img src="../assets/icons/heart.png" alt="favorites">
                    <span data-i18n="favorites">Favorites</span>
                </a>
            </div>
            <div class="menu-item">
                <a href="feedback.html">
                    <img src="../assets/icons/blog.png" alt="reviews">
                    <span data-i18n="reviews">Reviews</span>
                </a>
            </div>
            <div class="menu-item">
                <a href="cart.html">
                    <img src="../assets/icons/cart.png" alt="cart">
                    <span data-i18n="cart">Cart</span>
                </a>
            </div>
            <div class="menu-item" id="adminMenuItem" style="display: block;">
                <div class="active-indicator"></div>
                <a href="admin.html">
                    <img src="../assets/icons/admin.png" alt="admin">
                    <span data-i18n="admin">Admin</span>
                </a>
            </div>
        </nav>
    </div>

    <div class="main-content">
        <div class="catalog-header">
            <h1 data-i18n="admin-panel">👑 Admin Panel</h1>
            <p data-i18n="admin-subtitle">Manage products and reviews</p>
            <a href="catalog.html" class="back-link" data-i18n="back-to-catalog">← Back to catalog</a>
        </div>

        <div id="accessDenied" class="access-denied" style="display: none;">
            <h2 data-i18n="access-denied">⛔ Access Denied</h2>
            <p data-i18n="access-denied-text">This page is only available to administrators.</p>
            <a href="catalog.html" class="back-link" data-i18n="back-to-catalog">Back to catalog</a>
        </div>

        <div id="adminContent" style="display: none;">
            <div class="admin-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px;">
                    <h2 data-i18n="products-management">📦 Products Management</h2>
                    <button class="add-product-btn" id="openAddProductModalBtn" data-i18n="add-product">➕ Add product</button>
                </div>
                <div class="products-list">
                    <h3 data-i18n="product-list">Product list</h3>
                    <div class="search-box">
                        <input type="text" id="searchProduct" data-i18n="search-products" placeholder="🔍 Search products...">
                    </div>
                    <div id="productsContainer" class="products-table-container">
                        <div class="loading" data-i18n="loading-data">Loading...</div>
                    </div>
                </div>
            </div>
            <div class="admin-section">
                <h2 data-i18n="reviews-management">💬 Reviews Management</h2>
                <div class="reviews-filters">
                    <div class="form-group">
                        <label data-i18n="filter-by-product">Filter by product</label>
                        <select id="adminFilterProduct">
                            <option value="all" data-i18n="all-products-filter">All products</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="filter-by-user">Filter by user</label>
                        <select id="adminFilterUser">
                            <option value="all" data-i18n="all-users">All users</option>
                        </select>
                    </div>
                    <button id="applyFiltersBtn" class="filter-btn" data-i18n="apply-filters">🔍 Apply filters</button>
                </div>
                <div id="reviewsContainer" class="reviews-list-container">
                    <div class="loading" data-i18n="loading-data">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/translations.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/features.js"></script>
    <script src="../js/admin.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof ModalManager !== 'undefined' && !window.modalManager) {
                window.modalManager = new ModalManager();
                console.log('ModalManager initialized for admin panel');
            }
            
            if (window.innerWidth <= 1200 && typeof BurgerMenu !== 'undefined') {
                if (!window.burgerMenuInstance) {
                    window.burgerMenuInstance = new BurgerMenu();
                }
            }
        });
    </script>
</body>
</html>
